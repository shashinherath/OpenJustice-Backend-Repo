[project]
name = "app"
version = "0.1.0"
description = "OpenJustice Backend - AI-powered legal assistance platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core Backend Framework
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.3.0",
    # Database & ORM
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # AI & LLM
    "openai>=1.35.0",
    "langchain>=0.2.5",
    "langchain-openai>=0.1.8",
    "langchain-community>=0.2.5",
    "pypdf>=4.2.0",
    "transformers>=4.41.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",
    # Speech & Audio
    # Note: Using OpenAI API for Whisper instead of local installation to avoid compatibility issues
    # "openai-whisper>=20231117",  # Commented out due to Python version conflicts
    "pydub>=0.25.1",
    "soundfile>=0.12.1",
    # Messaging & Communication
    "httpx>=0.27.0",
    "websockets>=12.0",
    "twilio>=9.2.0",
    # Object Storage
    "boto3>=1.34.0",
    "minio>=7.2.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.0",
    "tiktoken>=0.7.0",
    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    # Code Quality
    "black>=24.4.0",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "isort>=5.13.0",
    "bcrypt>=3.2.0,<4.0.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.24.0",
    "jupyter>=1.0.0",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=html --cov-report=term-missing"
