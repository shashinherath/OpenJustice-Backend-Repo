name: Deploy OpenJustice Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: |
          REPO="${{ github.repository }}"
          echo "name=ghcr.io/${REPO,,}/openjustice-api" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ steps.image.outputs.name }}:${{ github.sha }} \
            -t ${{ steps.image.outputs.name }}:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }}
          docker push ${{ steps.image.outputs.name }}:latest

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ${{ steps.image.outputs.name }}:${{ github.sha }}
          containerAppName: openjustice-api
          resourceGroup: OpenJustice-RG
          containerAppEnvironment: managedEnvironment-OpenJusticeRG-855d
