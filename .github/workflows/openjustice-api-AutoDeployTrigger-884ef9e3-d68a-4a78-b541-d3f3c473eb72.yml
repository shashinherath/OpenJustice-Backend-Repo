name: Trigger auto deployment for openjustice-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/openjustice-api-AutoDeployTrigger-884ef9e3-d68a-4a78-b541-d3f3c473eb72.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.OPENJUSTICEAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.OPENJUSTICEAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.OPENJUSTICEAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.OPENJUSTICEAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.OPENJUSTICEAPI_REGISTRY_PASSWORD }}
          containerAppName: openjustice-api
          resourceGroup: OpenJustice-RG
          imageToBuild: ghcr.io/openjustice-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


